<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1330">
<meta name="description" content="夕暮れの海辺・夜の参道・海の底を走る3Dカートレース。部屋番号と鍵で、最大8人のオンライン対戦。">
<meta property="og:type" content="website">
<meta property="og:title" content="汐風GP — 汐風グランプリ">
<meta property="og:description" content="招待されたら、なまえとキャラをえらんで「参加」。最大8人でレース！">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2718%27%20fill%3D%27%231c1330%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2734%27%20r%3D%2721%27%20fill%3D%27%23ff5a6e%27/%3E%3Cpath%20d%3D%27M17%2040c7-12%2023-12%2030%200%27%20stroke%3D%27%23fff6ea%27%20stroke-width%3D%276%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27/%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2723%27%20r%3D%276%27%20fill%3D%27%23ffb54a%27/%3E%3C/svg%3E">
<title>汐風グランプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD pinned to the four corners; menus float as glassy plum panels over a live attract-mode race. */
:root{
  --ink:#1c1330; --ink-2:#2a1e48; --ink-3:#3b2c63;
  --paper:#fff6ea; --paper-dim:#d9cfe6;
  --sun:#ffb54a; --coral:#ff5a6e; --sea:#35d3c3; --lilac:#a493ff;
  --glass:rgba(28,19,48,.72); --glass-line:rgba(255,246,234,.14);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-digit:"Chakra Petch","M PLUS Rounded 1c",ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);font-weight:500;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(28,19,48,.55) 100%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
.hud-tl{position:absolute;top:calc(14px + var(--sat));left:calc(16px + var(--sal));display:grid;gap:6px}
.lap{font-family:var(--f-display);font-size:clamp(22px,3.4vw,34px);line-height:1;letter-spacing:.02em;text-shadow:0 3px 0 var(--ink),0 0 18px rgba(28,19,48,.6)}
.lap small{font-size:.5em;color:var(--sun);letter-spacing:.14em;margin-right:.35em;vertical-align:.35em}
.lap .of{color:var(--paper-dim);font-size:.62em}
.clock{font-family:var(--f-digit);font-weight:700;font-size:clamp(16px,2vw,22px);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 2px 0 var(--ink)}
.laps{font-family:var(--f-digit);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;color:var(--paper-dim);display:grid;gap:1px;text-shadow:0 1px 0 var(--ink)}
.laps span b{color:var(--sea);font-weight:700;margin-right:6px}

.hud-tr{position:absolute;top:calc(12px + var(--sat));right:calc(16px + var(--sar));display:flex;gap:10px;align-items:flex-start}
.itembox{width:clamp(74px,9vw,96px);aspect-ratio:1;border-radius:22px;background:linear-gradient(160deg,rgba(255,246,234,.22),rgba(255,246,234,.04)),var(--glass);border:3px solid var(--paper);box-shadow:0 5px 0 var(--ink),inset 0 0 0 3px var(--ink-3);display:grid;place-items:center;position:relative;overflow:hidden}
.itembox svg{width:72%;height:72%}
.itembox.rolling svg{animation:jolt .08s steps(2) infinite}
.itembox .cnt{position:absolute;right:6px;bottom:2px;font-family:var(--f-display);font-size:18px;text-shadow:0 2px 0 var(--ink)}
.itembox.ready{animation:pulse 1.1s ease-in-out infinite}
.itemkey{font-size:11px;color:var(--paper-dim);text-align:center;margin-top:4px;letter-spacing:.06em}
@keyframes jolt{50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--ink),inset 0 0 0 3px var(--sun),0 0 24px rgba(255,181,74,.55)}}

.hud-br{position:absolute;right:calc(18px + var(--sar));bottom:calc(10px + var(--sab));text-align:right}
.pos{font-family:var(--f-display);font-size:clamp(64px,10vw,124px);line-height:.9;letter-spacing:-.02em;background:linear-gradient(180deg,var(--paper) 10%,var(--sun) 58%,var(--coral) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px var(--ink);filter:drop-shadow(0 5px 0 var(--ink)) drop-shadow(0 0 16px rgba(255,90,110,.35));transform-origin:100% 100%}
.pos sup{font-size:.36em;vertical-align:1.25em;margin-left:.04em;-webkit-text-stroke:2px var(--ink);background:inherit;-webkit-background-clip:text;background-clip:text}
.pos.bump{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.speed{font-family:var(--f-digit);font-weight:700;font-size:clamp(18px,2.2vw,26px);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--ink);margin-top:4px}
.speed small{font-size:.5em;color:var(--paper-dim);margin-left:4px;letter-spacing:.1em}
.charge{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.charge i{width:22px;height:7px;border-radius:4px;background:rgba(255,246,234,.18);box-shadow:0 2px 0 var(--ink)}
.charge i.c1{background:#5ab8ff}.charge i.c2{background:var(--sun)}.charge i.c3{background:#ff6be0}

.hud-bl{position:absolute;left:calc(14px + var(--sal));bottom:calc(12px + var(--sab))}
#map{width:clamp(130px,17vw,200px);height:clamp(130px,17vw,200px);display:block;filter:drop-shadow(0 4px 0 rgba(28,19,48,.7))}

.banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(56px,11vw,150px);line-height:1;color:var(--paper);-webkit-text-stroke:4px var(--ink);text-shadow:0 8px 0 var(--ink);opacity:0}
.banner.show{animation:pop 1s cubic-bezier(.2,1.5,.4,1) forwards}
.banner.b-go{color:var(--sun)}
.banner.b-small{font-size:clamp(34px,6vw,72px);top:22%}
.banner.b-final{color:var(--coral)}
@keyframes pop{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9) translateY(-14px)}}
.toast{position:fixed;left:50%;top:calc(18px + var(--sat));transform:translateX(-50%);font-size:14px;font-weight:800;background:var(--glass);border:1px solid var(--glass-line);padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.itembox .timer{position:absolute;left:10px;right:10px;bottom:7px;height:6px;border-radius:3px;background:rgba(28,19,48,.6);overflow:hidden}
.itembox .timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sun),#fff3b0);border-radius:3px}
.itembox.got{animation:got .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes got{0%{transform:scale(1.4) rotate(-6deg)}100%{transform:scale(1)}}

.ranks{position:absolute;left:calc(14px + var(--sal));top:44%;transform:translateY(-50%);width:76px;height:calc(8 * 36px)}
.rchip{position:absolute;left:0;top:0;height:36px;display:flex;align-items:center;gap:6px;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.rchip b{width:16px;text-align:right;font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--paper);text-shadow:0 2px 0 var(--ink)}
.rchip img,.rchip i{width:30px;height:30px;border-radius:10px;object-fit:contain;object-position:50% 100%;padding:2px 1px 0;background:var(--c);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--c)}
.rchip.me img,.rchip.me i{width:34px;height:34px;box-shadow:0 0 0 3px var(--sun),0 0 14px rgba(255,181,74,.6)}
.rchip.me b{color:var(--sun)}
.warn{position:fixed;left:50%;top:calc(68px + var(--sat));transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px 16px 6px 8px;border-radius:999px;background:var(--coral);color:var(--ink);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--ink);animation:warnp .45s ease-in-out infinite alternate;pointer-events:none}
.warn svg{width:30px;height:30px;background:var(--paper);border-radius:50%;padding:2px}
@keyframes warnp{to{transform:translateX(-50%) scale(1.08)}}
.wrong{position:fixed;left:0;right:0;top:40%;text-align:center;font-family:var(--f-display);font-size:clamp(28px,5vw,52px);color:var(--coral);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:blink .7s steps(2) infinite;pointer-events:none}
@keyframes blink{50%{opacity:.25}}
#ink{position:fixed;inset:0;pointer-events:none;transition:opacity .2s}
#ink i{position:absolute;border-radius:46% 54% 42% 58%/55% 40% 60% 45%;background:radial-gradient(circle at 38% 32%,#4a3a72 0%,#1c1330 46%,#120c22 100%);box-shadow:0 0 0 1.4vmin rgba(28,19,48,.55),2vmin 3vmin 0 -1vmin #1c1330,-3vmin -2vmin 0 -1.6vmin #1c1330}
#ink i::after{content:"";position:absolute;left:30%;top:80%;width:14%;height:60%;border-radius:0 0 50% 50%;background:#1c1330}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,transparent 35%,var(--fc,#ff5a6e) 130%)}
#flash.on{animation:flashk .55s ease-out}
@keyframes flashk{0%{opacity:1}100%{opacity:0}}
.toggles{display:flex;gap:6px}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
body.touch #touch.on{display:block}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(28,19,48,.38);border:2px solid rgba(255,246,234,.5);display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:var(--paper);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
.tbtn.held{background:rgba(255,181,74,.45);border-color:var(--sun)}
.tbtn svg{width:46%;height:46%}
#tLeft{left:calc(18px + var(--sal));bottom:calc(28px + var(--sab));width:84px;height:84px}
#tRight{left:calc(116px + var(--sal));bottom:calc(28px + var(--sab));width:84px;height:84px}
#tDrift{right:calc(22px + var(--sar));bottom:calc(30px + var(--sab));width:96px;height:96px;font-size:15px}
#tItem{right:calc(132px + var(--sar));bottom:calc(52px + var(--sab));width:70px;height:70px}
#tBrake{right:calc(40px + var(--sar));bottom:calc(140px + var(--sab));width:62px;height:62px;font-size:10px;white-space:nowrap;letter-spacing:-.02em}
body.touch .hud-bl{bottom:auto;top:calc(96px + var(--sat))}
body.touch #map{width:clamp(96px,13vw,140px);height:clamp(96px,13vw,140px)}
body.touch .hud-br{bottom:auto;top:calc(8px + var(--sat));right:calc(16px + var(--sar) + clamp(74px,9vw,96px) + 14px)}
body.touch .pos{font-size:clamp(48px,8vw,84px)}
body.touch .ranks{display:none}
#tItem svg{width:64%;height:64%}
#tPause{position:fixed;pointer-events:auto;top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:14px;background:rgba(28,19,48,.45);border:2px solid rgba(255,246,234,.4);display:grid;place-items:center}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));padding-block:calc(16px + var(--sat)) calc(16px + var(--sab));overflow:auto}
.screen[hidden]{display:none!important}
#title{background:linear-gradient(90deg,rgba(28,19,48,.78) 0%,rgba(28,19,48,.35) 46%,rgba(28,19,48,.1) 100%)}
.screen>*{margin-block:auto}
.title-wrap{width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:clamp(20px,4vw,56px);align-items:center}
.logo{display:grid;gap:10px;align-content:center}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.32em;color:var(--sea);text-transform:uppercase}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(64px,10.5vw,148px);line-height:.86;letter-spacing:-.03em;color:var(--paper);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink),0 10px 40px rgba(255,90,110,.45);text-wrap:balance}
.logo h1 em{font-style:normal;display:inline-block;color:var(--sun);transform:rotate(-6deg) translateY(-.04em);margin-left:.04em}
.logo .sub{font-family:var(--f-digit);font-weight:700;letter-spacing:.42em;font-size:clamp(12px,1.3vw,16px);color:var(--paper)}
.logo p{margin:6px 0 0;max-width:34ch;line-height:1.75;color:var(--paper-dim);font-size:14px}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:12px;color:var(--paper-dim)}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;max-width:470px}
.course{display:grid;gap:2px;justify-items:start;text-align:left;padding:8px 10px 10px;border-radius:18px;background:var(--glass);border:2px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,border-color .15s,background .15s;min-width:0}
.course:hover{transform:translateY(-3px)}
.course[aria-pressed="true"]{border-color:var(--cc);background:var(--ink-3);box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 22%,transparent)}
.course canvas{width:100%;aspect-ratio:8/5;display:block;margin-bottom:4px;border-radius:10px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--cc) 28%,var(--ink)) 0%,var(--ink) 80%)}
.course b{font-weight:800;font-size:13px;line-height:1.25;letter-spacing:.02em;text-wrap:balance}
.course span{font-size:10.5px;color:var(--paper-dim);line-height:1.3}
.keys span{display:inline-flex;gap:6px;align-items:center}
kbd{font-family:var(--f-digit);font-weight:700;font-size:11px;min-width:24px;padding:3px 6px;border-radius:6px;background:var(--paper);color:var(--ink);box-shadow:0 2px 0 var(--paper-dim);text-align:center}

.panel{background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 60px rgba(10,6,22,.45);display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 small{font-family:var(--f-body);font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--sea)}
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.racer{position:relative;border-radius:18px;padding:6px 6px 8px;background:var(--ink-2);border:2px solid transparent;display:grid;gap:2px;justify-items:center;transition:transform .15s,border-color .15s,background .15s}
.racer:hover{transform:translateY(-3px)}
.racer[aria-pressed="true"]{border-color:var(--sun);background:var(--ink-3);box-shadow:0 0 0 4px rgba(255,181,74,.18)}
.racer img,.racer .ph{width:100%;aspect-ratio:1;object-fit:contain;object-position:50% 100%;padding:8% 6% 0;border-radius:13px;display:block;background:radial-gradient(circle at 50% 35%,var(--chip,#555) 0%,var(--ink) 95%)}
.racer b{font-weight:800;font-size:13px;letter-spacing:.04em}
.racer .kind{font-size:10px;color:var(--paper-dim);letter-spacing:.04em}
.detail{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.detail .nm{grid-column:1/-1;display:flex;align-items:baseline;gap:10px}
.detail .nm b{font-family:var(--f-display);font-weight:400;font-size:24px}
.detail .nm span{font-size:12px;color:var(--paper-dim)}
.detail label{font-size:12px;color:var(--paper-dim);font-weight:800;letter-spacing:.08em}
.bar{display:flex;gap:4px}
.bar i{flex:1;height:9px;border-radius:5px;background:rgba(255,246,234,.12)}
.bar i.on{background:linear-gradient(90deg,var(--sea),var(--lilac))}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ink-2);padding:5px;border-radius:16px}
.seg button{padding:10px 6px;border-radius:12px;font-weight:800;font-size:13px;display:grid;gap:1px;color:var(--paper-dim)}
.seg button small{font-family:var(--f-digit);font-size:11px;letter-spacing:.1em;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.go{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 20px;border-radius:20px;background:linear-gradient(180deg,var(--sun),var(--coral));color:var(--ink);font-family:var(--f-display);font-size:22px;letter-spacing:.06em;box-shadow:0 6px 0 #a3324a,0 14px 30px rgba(255,90,110,.35);transition:transform .1s,box-shadow .1s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #a3324a}
.go svg{width:22px;height:22px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12px;color:var(--paper-dim)}
.ghost{padding:8px 14px;border-radius:12px;border:1px solid var(--glass-line);font-weight:800;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.ghost svg{width:16px;height:16px}

#pause{background:rgba(20,13,36,.55)}
#results{background:linear-gradient(90deg,rgba(20,13,36,0) 30%,rgba(20,13,36,.55) 75%);justify-content:flex-end}
#results .card{width:min(500px,100%);gap:14px;padding:22px}
#results td{padding:5px 6px}
@media (max-width:860px),(max-height:560px){
  #results{justify-content:center;background:rgba(20,13,36,.45)}
}
@media (max-height:560px){
  #results .card{padding:14px;gap:8px}
  #resTitle{font-size:52px!important}
  #results td{padding:2px 6px;font-size:12px}
  td.who img{width:24px;height:24px}
  td.rk{font-size:15px}
}
.card{width:min(560px,100%);background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;padding:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;gap:18px;box-shadow:0 30px 60px rgba(10,6,22,.5)}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);text-align:center;letter-spacing:.04em;text-shadow:0 4px 0 var(--ink)}
#resTitle{font-size:clamp(64px,11vw,104px);line-height:.95;background:linear-gradient(180deg,var(--paper) 10%,var(--sun) 58%,var(--coral) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px var(--ink);text-shadow:none;filter:drop-shadow(0 6px 0 var(--ink))}
#resTitle small{font-size:.4em;vertical-align:1.1em;margin-left:.05em;background:inherit;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px var(--ink)}
.card .lead{text-align:center;color:var(--paper-dim);margin:-8px 0 0;font-size:14px}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.btn{padding:14px;border-radius:16px;background:var(--ink-3);font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--ink)}
.btn.primary{background:var(--paper);color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:7px 6px;border-bottom:1px solid var(--glass-line);font-size:14px}
td.rk{font-family:var(--f-display);font-size:20px;width:46px;text-align:center}
td.rk.r1{color:var(--sun)} td.rk.r2{color:var(--paper-dim)} td.rk.r3{color:#e59a6a}
td.who{display:flex;gap:10px;align-items:center;font-weight:800}
td.who img{width:38px;height:38px;border-radius:10px;background:var(--ink-2);object-fit:contain;object-position:50% 100%;padding:3px 2px 0}
td.tm{font-family:var(--f-digit);font-weight:700;text-align:right}
tr.me td{background:rgba(255,181,74,.14)}
tr.me td:first-child{border-radius:12px 0 0 12px} tr.me td:last-child{border-radius:0 12px 12px 0}
.you{font-size:10px;background:var(--sun);color:var(--ink);padding:2px 7px;border-radius:999px;letter-spacing:.06em}

/* ---------- Records (TOP3 per course and class) ---------- */
.records{max-width:470px;margin-top:12px;padding:10px 12px 8px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.records:empty{display:none}
.rec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 5px}
.rec-h b{font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:.08em}
.rec-h span{font-size:11px;font-weight:800;color:var(--paper-dim);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rec-list li{--m:var(--ink-3);display:grid;grid-template-columns:24px 28px minmax(0,1fr) auto auto;align-items:center;gap:9px;padding:4px 6px;border-radius:12px;min-height:36px}
.rec-list li.r1{--m:linear-gradient(180deg,#fff3b0,#ffd257 55%,#f29a2e)}
.rec-list li.r2{--m:linear-gradient(180deg,#ffffff,#cfc4e3)}
.rec-list li.r3{--m:linear-gradient(180deg,#ffd9bd,#e59a6a)}
.rec-list li i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:12px;line-height:1;color:var(--ink);background:var(--m);box-shadow:inset 0 -2px 0 rgba(28,19,48,.22),0 2px 0 rgba(12,8,24,.5)}
.rec-list li img,.rec-list li .ph{width:28px;height:28px;border-radius:9px;object-fit:contain;object-position:50% 100%;padding:2px 1px 0;background:radial-gradient(circle at 50% 35%,var(--c) 0%,var(--ink) 110%);display:block}
.rec-list li .ph{display:grid;place-items:center;padding:0;font-family:var(--f-display);font-weight:400;font-size:13px;color:var(--paper-dim);background:var(--ink-3)}
.rec-list .nm{display:flex;align-items:center;gap:6px;min-width:0;font-weight:800;font-size:12.5px}
.rec-list .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-list .nm em{flex:none;font-style:normal;font-family:var(--f-digit);font-weight:700;font-size:9px;letter-spacing:.14em;color:var(--sea);border:1px solid rgba(53,211,195,.35);padding:0 5px;border-radius:999px}
.rec-list small{font-family:var(--f-digit);font-weight:600;font-size:10.5px;color:var(--paper-dim);font-variant-numeric:tabular-nums}
.rec-list time{font-family:var(--f-digit);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:5.4em;text-align:right}
.rec-list li.r1 time{color:var(--sun)}
.rec-list li.empty{grid-template-columns:24px minmax(0,1fr);color:var(--paper-dim)}
.rec-list li.empty i{opacity:.4}
.rec-list li.empty .nm{font-weight:500;font-size:12px}
.rec-list li.new{background:rgba(255,181,74,.14);animation:recnew 1.3s ease-in-out 3}
@keyframes recnew{50%{box-shadow:0 0 0 2px rgba(255,181,74,.65)}}
.recb{--m:var(--ink-3);justify-self:center;display:inline-flex;align-items:center;gap:9px;margin:-8px 0 -2px;padding:5px 15px 5px 6px;border-radius:999px;background:rgba(255,181,74,.13);border:1px solid rgba(255,181,74,.42);font-weight:800;font-size:13px;color:var(--paper);animation:pop2 .5s cubic-bezier(.2,1.6,.4,1)}
.recb i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:13px;line-height:1;color:var(--ink);background:var(--m);box-shadow:inset 0 -2px 0 rgba(28,19,48,.22)}
.recb.r1{--m:linear-gradient(180deg,#fff3b0,#ffd257 55%,#f29a2e)}
.recb.r2{--m:linear-gradient(180deg,#ffffff,#cfc4e3)}
.recb.r3{--m:linear-gradient(180deg,#ffd9bd,#e59a6a)}
@keyframes pop2{0%{transform:scale(.7)}100%{transform:scale(1)}}
@media (max-height:800px) and (min-width:861px){
  .keys{display:none}
}
@media (max-width:860px){
  .records{max-width:none;padding:8px 10px}
  .rec-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .rec-list li{grid-template-columns:22px minmax(0,1fr);grid-template-areas:"m t" "m n";column-gap:7px;row-gap:1px;padding:6px 8px;background:rgba(12,8,24,.35)}
  .rec-list li i{grid-area:m}
  .rec-list li time{grid-area:t;text-align:left;min-width:0;font-size:13.5px}
  .rec-list li .nm{grid-area:n;font-size:10.5px}
  .rec-list li .nm em{display:none}
  .rec-list li img,.rec-list li .ph,.rec-list li small{display:none}
  .rec-list li.empty{grid-template-areas:"m n";grid-template-columns:22px minmax(0,1fr)}
  .rec-list li.empty .nm{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (max-height:560px) and (min-width:640px){
  .records{display:none}
}

/* ---------- Online lobby ---------- */
.btns .wide{grid-column:1/-1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:18px;background:rgba(12,8,24,.5);border:1px solid var(--glass-line)}
.modes button{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:13px;font-family:var(--f-display);font-size:15px;letter-spacing:.06em;color:var(--paper-dim);transition:background .15s,color .15s}
.modes button:hover{color:var(--paper)}
.modes button svg{width:18px;height:18px;flex:none}
.modes button small{font-family:var(--f-digit);font-weight:700;font-size:10px;letter-spacing:.16em;color:var(--sea);margin-left:-2px}
.modes button[aria-pressed="true"]{background:linear-gradient(180deg,var(--paper),#f3e4cf);color:var(--ink);box-shadow:0 3px 0 rgba(12,8,24,.6)}
.modes button[aria-pressed="true"] small{color:#0e8a80}
.lobby{display:grid;gap:10px;padding:12px;border-radius:20px;background:linear-gradient(160deg,rgba(53,211,195,.12),rgba(164,147,255,.06) 60%),var(--ink-2);border:1px solid rgba(53,211,195,.28);min-width:0}
.lobby>*{min-width:0}
.lb-msg{margin:0;font-size:13px;line-height:1.65;color:var(--paper-dim)}
.lb-msg b{color:var(--paper);font-weight:800}
.lb-name{display:flex;align-items:center;gap:10px}
.lb-name label{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--paper-dim);white-space:nowrap}
.lb-name input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:15px;padding:8px 12px;border-radius:12px;border:2px solid var(--glass-line);background:rgba(12,8,24,.55);color:var(--paper);-webkit-user-select:text;user-select:text;outline:none}
.lb-name input::placeholder{color:rgba(255,246,234,.3)}
.lb-name input:focus,.lb-code input:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(53,211,195,.25)}
.lb-join{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);gap:10px;align-items:center}
.lb-new{display:grid;gap:8px;justify-items:start;min-width:0}
.lb-new .lb-make{width:100%}
.lb-make{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:16px;background:linear-gradient(180deg,var(--sea),#22a99c);color:var(--ink);box-shadow:0 4px 0 #126b63;transition:transform .1s,box-shadow .1s}
.lb-make:active{transform:translateY(3px);box-shadow:0 1px 0 #126b63}
.lb-make svg{grid-row:span 2;width:26px;height:26px;padding:4px;border-radius:10px;background:rgba(28,19,48,.16)}
.lb-make b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.04em;line-height:1.2}
.lb-make small{font-size:10.5px;font-weight:800;opacity:.75}
.lb-or{font-size:11px;font-weight:800;color:var(--paper-dim);letter-spacing:.1em}
.lb-code{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end;min-width:0}
.lb-code label{display:grid;gap:3px;min-width:0}
.lb-code label small{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--sea)}
.lb-code input{width:100%;min-width:0;font-family:var(--f-digit);font-weight:700;font-size:20px;letter-spacing:.22em;text-indent:.22em;text-align:center;padding:7px 2px;border-radius:12px;border:2px solid var(--glass-line);background:rgba(12,8,24,.55);color:var(--paper);-webkit-user-select:text;user-select:text;outline:none;font-variant-numeric:tabular-nums}
.lb-code input::placeholder{color:rgba(255,246,234,.22)}
.lb-code button{height:44px;padding:0 14px;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(12,8,24,.6);white-space:nowrap}
.lb-code button:disabled,.lb-make:disabled{opacity:.45;cursor:default}
.lb-code button.hot{background:linear-gradient(180deg,var(--sea),#22a99c);color:var(--ink);box-shadow:0 3px 0 #126b63;animation:hot 1.6s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 3px 0 #126b63,0 0 0 5px rgba(53,211,195,.25)}}
.lb-invite{padding:8px 10px;border-radius:12px;background:rgba(255,181,74,.12);color:var(--paper)}
.lb-invite b{color:var(--sun)}
.lb-join.invited{grid-template-columns:1fr}
.lb-join.invited .lb-new,.lb-join.invited .lb-or{display:none}
.lb-alt{display:inline;margin-left:6px;padding:0;font-size:inherit;font-weight:800;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.lb-keyb{display:inline-flex;align-items:center;gap:4px;margin-left:4px;padding:3px 9px 3px 7px;border-radius:999px;background:rgba(255,181,74,.15);color:var(--sun);font-family:var(--f-digit);font-weight:700;font-size:13px;letter-spacing:.14em;align-self:center;white-space:nowrap}
.lb-keyb svg{width:13px;height:13px}
.lb-keyb.open{background:rgba(255,246,234,.08);color:var(--paper-dim);font-family:var(--f-body);font-weight:800;font-size:10.5px;letter-spacing:.06em}
.lb-status{margin:0;font-size:12px;font-weight:800;color:var(--sun);min-height:1em}
.lb-status:empty{display:none}
.lb-head{display:flex;align-items:center;gap:8px;min-width:0}
.lb-room{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.lb-room small{font-family:var(--f-digit);font-weight:700;font-size:10px;letter-spacing:.24em;color:var(--sea)}
.lb-room b{font-family:var(--f-digit);font-weight:700;font-size:28px;line-height:1;letter-spacing:.18em;font-variant-numeric:tabular-nums;color:var(--paper);text-shadow:0 3px 0 var(--ink)}
.lb-dot{width:8px;height:8px;border-radius:50%;background:var(--sea);box-shadow:0 0 0 3px rgba(53,211,195,.22);flex:none}
.lb-dot.off{background:var(--coral);box-shadow:0 0 0 3px rgba(255,90,110,.25);animation:blink .9s steps(2) infinite}
.lb-head .ghost{padding:6px 10px}
.lb-mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0;padding:0;list-style:none}
.lb-mem li{position:relative;display:flex;align-items:center;gap:7px;min-width:0;padding:5px 6px 5px 5px;border-radius:13px;background:rgba(12,8,24,.42);border:1.5px solid transparent}
.lb-mem li.me{border-color:var(--sun);background:rgba(255,181,74,.12)}
.lb-mem li .fc{width:30px;height:30px;flex:none;border-radius:10px;object-fit:contain;object-position:50% 100%;padding:2px 1px 0;background:radial-gradient(circle at 50% 35%,var(--c) 0%,var(--ink) 110%)}
.lb-mem li span{display:grid;min-width:0;line-height:1.2}
.lb-mem li span b{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-mem li span em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--paper-dim)}
.lb-mem li.me span em{color:var(--sun)}
.lb-mem li .cr{position:absolute;left:-4px;top:-6px;width:16px;height:16px;color:var(--sun);filter:drop-shadow(0 1px 0 var(--ink))}
.lb-mem li.slot{background:transparent;border:1.5px dashed rgba(255,246,234,.16);justify-content:center;color:rgba(255,246,234,.34);font-size:10.5px;font-weight:800;letter-spacing:.08em;gap:5px;min-height:42px}
.lb-mem li.slot svg{width:16px;height:16px}
.lb-mem li.slot.cpu{color:rgba(164,147,255,.75);border-color:rgba(164,147,255,.28)}
.lb-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--paper-dim);font-weight:800}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:11.5px;color:var(--paper)}
.switch i{position:relative;width:38px;height:22px;border-radius:999px;background:rgba(12,8,24,.6);border:1.5px solid var(--glass-line);transition:background .15s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--paper-dim);transition:transform .18s cubic-bezier(.3,1.4,.5,1),background .15s}
.switch[aria-checked="true"] i{background:var(--lilac);border-color:transparent}
.switch[aria-checked="true"] i::after{transform:translateX(16px);background:var(--paper)}
.switch:disabled{cursor:default;opacity:.7}
.cnote{display:flex;align-items:center;gap:7px;margin-top:12px;margin-bottom:-6px;font-size:12px;font-weight:800;color:var(--sun);letter-spacing:.04em}
.cnote svg{width:16px;height:16px}
.course:disabled{cursor:default}
.course:disabled:hover{transform:none}
.course:disabled[aria-pressed="false"]{opacity:.42}
.seg.locked button{cursor:default}
.seg.locked button[aria-pressed="false"]{opacity:.5}
.go:disabled{background:var(--ink-3);color:var(--paper-dim);box-shadow:0 6px 0 rgba(12,8,24,.7);cursor:default;font-size:17px}
.go:disabled svg{display:none}
.go:disabled:active{transform:none}
.go .n{font-family:var(--f-digit);font-weight:700;font-size:.62em;letter-spacing:.08em;padding:2px 9px;border-radius:999px;background:rgba(28,19,48,.2)}
.go.wait::before{content:"";width:14px;height:14px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.panel.online .roster{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.panel.online .racer{padding:3px 3px 5px;border-radius:13px}
.panel.online .racer img,.panel.online .racer .ph{border-radius:10px;padding:6% 4% 0}
.panel.online .racer b{font-size:10.5px;letter-spacing:0}
.panel.online .racer .kind{display:none}
.panel.online .detail{grid-template-columns:auto 1fr auto 1fr;gap:3px 12px}
.panel.online .detail .nm b{font-size:19px}
.panel.online .detail .nm span{font-size:11px}
.panel.online .detail label{font-size:10.5px}
.panel.online .bar i{height:7px}
.waitpill{position:fixed;left:50%;top:34%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 20px 10px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:800;font-size:15px;white-space:nowrap;pointer-events:none}
.waitpill i{width:16px;height:16px;border-radius:50%;border:3px solid var(--sea);border-right-color:transparent;animation:spin 1s linear infinite}
td.who .tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--paper-dim);border:1px solid var(--glass-line);padding:1px 6px;border-radius:999px}
td.tm.run{color:var(--sea);font-family:var(--f-body);font-weight:800;font-size:12px}
.rchip.hu img,.rchip.hu i{box-shadow:0 0 0 2px var(--paper)}
@media (max-height:820px) and (min-width:861px){
  .panel.online .detail label,.panel.online .detail .bar{display:none}
  .panel.online{gap:10px}
}
@media (max-width:520px){
  .panel.online .roster{grid-template-columns:repeat(4,minmax(0,1fr))}
  .lb-join{grid-template-columns:1fr}
  .lb-or{text-align:center}
  .lb-new{grid-template-columns:1fr;justify-items:stretch}
  .lb-keyb{padding:2px 7px 2px 5px;font-size:12px}
  .modes button small{display:none}
  .lb-room small{display:none}
  .lb-room b{font-size:24px;letter-spacing:.12em}
  .lb-head .ghost{white-space:nowrap;padding:6px 9px}
  .lb-mem{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .lb-mem li{flex-direction:column;gap:2px;padding:5px 3px 4px;text-align:center}
  .lb-mem li span{justify-items:center;max-width:100%}
  .lb-mem li span em{display:none}
  .lb-mem li.slot{min-height:58px;flex-direction:column}
}

#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:20;font-family:var(--f-display);letter-spacing:.1em;transition:opacity .5s}

#loading p span{font-family:var(--f-body);font-weight:800;font-size:13px;letter-spacing:.12em;color:var(--paper-dim);min-height:1em}

#err{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 16px;border-radius:14px;background:var(--coral);color:var(--ink);font-weight:800;z-index:30}
